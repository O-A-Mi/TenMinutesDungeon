services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tmd
      POSTGRES_PASSWORD: tmd
      POSTGRES_DB: tmd
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tmd -d tmd']
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - tmd-postgres:/var/lib/postgresql/data
      - ./apps/server/src/db/migrations.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      DATABASE_URL: postgresql://tmd:tmd@postgres:5432/tmd
      PORT: 3001
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:4173}
      APP_ORIGINS: ${APP_ORIGINS:-http://localhost:4173,http://127.0.0.1:4173}
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '4173:80'
    depends_on:
      server:
        condition: service_healthy
volumes:
  tmd-postgres:
